<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden findes ikke — Auning Skole Nyheder</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#050505;color:#fff;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 24px;
  overflow-x:hidden;position:relative;
}

/* ─── BACKGROUND ─── */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%,rgba(226,0,26,.09),transparent 60%),
    radial-gradient(ellipse 55% 40% at 50% 100%,rgba(40,60,180,.06),transparent 70%);
}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.055;mix-blend-mode:overlay;
}
.bg-404{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(280px,52vw,780px);
  font-weight:900;letter-spacing:-.07em;line-height:.8;
  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.045);
  user-select:none;white-space:nowrap;
  animation:drift 22s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50.6%) scale(1.012)}
}

/* ─── CONTENT ─── */
.content{
  position:relative;z-index:1;
  max-width:460px;width:100%;text-align:center;
}

.status{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  color:#888;margin-bottom:32px;
  animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) .1s both;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:#e2001a;
  box-shadow:0 0 0 0 rgba(226,0,26,.5);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(226,0,26,.5)}
  50%{box-shadow:0 0 0 7px rgba(226,0,26,0)}
}

h1{
  font-size:clamp(30px,5vw,44px);
  font-weight:800;letter-spacing:-.035em;line-height:1.08;
  color:#fff;margin-bottom:20px;
  animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) .2s both;
}

.lead{
  font-size:16px;line-height:1.65;color:#8a8a8a;
  margin-bottom:44px;max-width:380px;
  margin-left:auto;margin-right:auto;
  animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) .3s both;
}

.btn-wrap{animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) .4s both}

.btn{
  display:inline-flex;align-items:center;gap:12px;
  padding:16px 28px;
  background:#fff;color:#050505;
  font-size:15px;font-weight:700;letter-spacing:-.005em;
  border-radius:8px;text-decoration:none;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),
             box-shadow .3s cubic-bezier(.2,.7,.3,1);
  position:relative;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(255,255,255,.14);
}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:5px}
.btn svg{
  flex:none;
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.btn:hover svg{transform:translateX(4px)}

.meta{
  margin-top:52px;
  font-size:11px;color:#3a3a3a;
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  animation:fadeUp .6s cubic-bezier(.2,.7,.3,1) .5s both;
}
.meta a{
  color:#5a5a5a;text-decoration:none;
  border-bottom:1px solid transparent;
  padding-bottom:1px;
  transition:color .2s ease,border-color .2s ease;
}
.meta a:hover{color:#fff;border-color:#fff}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>
  <div class="bg">
    <div class="bg-404">404</div>
  </div>

  <main class="content">
    <div class="status">
      <span class="status-dot"></span>
      <span>Siden er ikke længere aktiv</span>
    </div>

    <h1>Denne side findes<br>ikke længere</h1>

    <p class="lead">Auning Skole Nyheder er flyttet. Alt indhold findes nu på den nye adresse.</p>

    <div class="btn-wrap">
      <a href="https://s0nwyy.github.io/Auning-Skole.news/" class="btn" target="_blank" rel="noopener">
        Besøg den nye side
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>

    <p class="meta">Auning Skole Nyheder · <a href="https://s0nwyy.github.io/Auning-Skole.news/" target="_blank" rel="noopener">Ny side</a></p>
  </main>
</body>
</html>
